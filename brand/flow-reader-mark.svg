      d="M68.83,28.13C68,28.5 66.36,30.1 66.1,30.79C66.02,30.98 65.81,31.51 65.62,31.99C64.62,34.45 65,34.69 69.89,34.69C74.82,34.69 75.33,34.49 75.18,32.58C74.93,29.26 71.55,26.89 68.83,28.13Z" />
