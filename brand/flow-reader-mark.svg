<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1080" height="1080">
  <title>Flow Reader mark</title>
  <!--
    Master source for every Flow Reader icon, traced from brand/concept/flow-reader-concept.jpg by
    brand/trace/trace.mjs (re-running it overwrites this file; hand edits are fine otherwise).
    108-unit grid = Android adaptive icon canvas: the launcher shows the centre 72 units; keep foreground
    art inside the 66-unit circle around (54,54).
    Colours: override the fr-* CSS custom properties (inline SVG / CSS); var() fallbacks are the brand defaults.
    data-mono: body = silhouette that holes cut through, solid = extra silhouette shape, hole = cut-out,
    skip = colour-only detail. data-stat="skip" drops a shape from the 24dp status-bar icon.
    Regenerate Android resources: node brand/build.mjs
  -->
  <defs>
    <radialGradient id="g-bg" gradientUnits="userSpaceOnUse" cx="54" cy="54" r="76">
      <stop offset="0" style="stop-color: var(--fr-bg-center, #111320)" />
      <stop offset="1" style="stop-color: var(--fr-bg-edge, #121623)" />
    </radialGradient>
    <linearGradient id="g-sheet" gradientUnits="userSpaceOnUse" x1="0" y1="26.24" x2="0" y2="81.76">
      <stop offset="0" style="stop-color: var(--fr-sheet-start, #3EC7CA)" />
      <stop offset="1" style="stop-color: var(--fr-sheet-end, #3F36B5)" />
    </linearGradient>
    <linearGradient id="g-back" gradientUnits="userSpaceOnUse" x1="0" y1="31.58" x2="0" y2="76.36">
      <stop offset="0" style="stop-color: var(--fr-back-start, #3A63AF)" />
      <stop offset="1" style="stop-color: var(--fr-back-end, #375DAA)" />
    </linearGradient>
    <linearGradient id="g-rim" gradientUnits="userSpaceOnUse" x1="0" y1="26.24" x2="0" y2="81.76">
      <stop offset="0" style="stop-color: var(--fr-rim-start, #6FE4E0)" />
      <stop offset="1" style="stop-color: var(--fr-rim-end, #5560CC)" />
    </linearGradient>
    <linearGradient id="g-ink" gradientUnits="userSpaceOnUse" x1="0" y1="33.2" x2="0" y2="74.3">
      <stop offset="0" style="stop-color: var(--fr-ink-start, #5DDCDF)" />
      <stop offset="1" style="stop-color: var(--fr-ink-end, #527FDB)" />
    </linearGradient>
  </defs>

  <g id="background">
    <path d="M0,0H108V108H0Z" fill="url(#g-bg)" />
  </g>

